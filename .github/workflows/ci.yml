name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: buddy, POSTGRES_PASSWORD: buddy, POSTGRES_DB: buddy }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U buddy" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://buddy:buddy@localhost:5432/buddy?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: backend/go.sum }
      - name: Test with coverage
        working-directory: backend
        run: |
          go vet ./...
          go test ./... -count=1 -coverpkg=./internal/... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage.out }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: mkdir -p coverage && npm run coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
